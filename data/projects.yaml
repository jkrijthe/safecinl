# Work package 1: Safeguarding against violations of causal assumptions
- number: "1.1"
  title: "Detecting and Quantifying Conditional Exchangeability Violations"
  phd: "Matej Havelka"
  # supervisors: ["Jesse Krijthe", "Jeremy Labrecque", "Sebastian Gabel", "Saskia le Cessie"]
  supervisors: ["Jesse Krijthe", "Jeremy Labrecque"]
  description: >-
    Many causal analyses assume that there is no hidden confounding or selection bias beyond what has
    been adjusted for, which cannot be tested from a single dataset without further assumptions. Researchers instead rely
    on sensitivity analysis, to provide a way to include uncertainty of hidden confounding within their findings. This
    project studies existing sensitivity analysis methods and extends them into various different settings, while 
    trying to provide a more data-informed methods to find sufficient sensitivity parameter.

- number: "1.2"
  title: "Detecting and Mitigating Positivity Violations"
  phd: "TBD"
  # supervisors: ["Jesse Krijthe", "Nan van Geloven", "Stéphanie van der Pas", "Ruth Keogh", "Dimitris Rizopoulos", "Frans Oliehoek"]
  supervisors: ["Jesse Krijthe", "Nan van Geloven", "Stéphanie van der Pas"]
  description: >-
    Positivity requires that every treatment option has a real chance of occurring for every kind of
    individual we want to draw conclusions about. This project develops methods to detect positivity
    violations in high-dimensional and time-varying treatment settings, such as intensive care medicine.
    It then identifies the subgroups and treatment policies for which the data still support trustworthy
    causal claims.

- number: "1.3"
  title: "Incorporating Assumption Uncertainty into Inference"
  phd: "Lasse Veenstra"
  # supervisors: ["Aad van der Vaart", "Jesse Krijthe", "Jeremy Labrecque", "Aurélie Lemmens"]
  supervisors: ["Aad van der Vaart", "Jesse Krijthe", "Jeremy Labrecque"]
  description: >-
    Detecting assumption violations is not enough: the remaining uncertainty about the assumptions should
    also be reflected in the causal conclusions. This project uses nonparametric Bayesian methods to
    combine statistical uncertainty, modelling uncertainty and expert knowledge into the uncertainty about
    causal estimates. It also develops sensitivity analyses for proximal inference, which relies on
    negative control variables.

# Work package 2: Safe triangulation
- number: "2.1"
  title: "Formalization of Triangulation"
  phd: "Keling Wang"
  # supervisors: ["Jeremy Labrecque", "Nan van Geloven", "Aad van der Vaart", "Mirjam Knol", "Frans Oliehoek"]
  supervisors: ["Jeremy Labrecque", "Nan van Geloven", "Aad van der Vaart"]
  description: >-
    Causal triangulation is traditionally understood as an exercise to answer causal questions with more certainty using causal studies of different designs. As a working definition, this leaves several formal aspects of such exercise undecided:  Where to ​head and how to proceed after collecting these causal studies? Is requiring causal studies to be 'independent' and/or 'diverse' necessary and sufficient for causal triangulation? Moreover, what is the role of statistical measures, and on what ground should we exercise causal triangulation at all? This project aims at formalizing causal triangulation and researching how one should conduct it. 

- number: "2.2"
  title: "Integration of Triangulated Estimates"
  phd: "TBD"
  # supervisors: ["Jeremy Labrecque", "Jesse Krijthe", "Stéphanie van der Pas", "Sebastian Gabel", "Mirjam Knol", "Saskia le Cessie"]
  supervisors: ["Jeremy Labrecque", "Jesse Krijthe", "Stéphanie van der Pas"]
  description: >-
    So far, triangulation has only compared estimates from different methods; this project investigates
    when and how their evidence can be combined. It develops ways to pool estimates from methods that rely
    on different causal assumptions, and to integrate methods that produce bounds rather than a single
    estimate, such as partial identification. It also addresses what to conclude when triangulation fails.

# Work package 3: Safe performance assessment of conditional causal models
- number: "3.1"
  title: "Performance Assessment for Conditional Average Treatment Effects"
  phd: "Isak Åslund"
  # supervisors: ["Nan van Geloven", "Jesse Krijthe", "Aad van der Vaart", "Aurélie Lemmens"]
  supervisors: ["Nan van Geloven", "Jesse Krijthe", "Aad van der Vaart", "Saskia le Cessie"]
  description: >-
    There is growing interest in personalizing treatment recommendations. This often relies on predictions of the Conditional Average Treatment Effect (CATE), defined as the expected treatment effect among individuals with a given set of characteristics. However, empirically evaluating the accuracy of such predictions is difficult as individual treatment effects are never observed. This project develops methods for trustworthy evaluation in randomized experiments and observational studies.

- number: "3.2"
  title: "Performance Assessment for Predictions under Interventions"
  phd: "Laura Melo Teixeira"
  # supervisors: ["Nan van Geloven", "Jesse Krijthe", "Ruth Keogh", "Dimitris Rizopoulos"]
  supervisors: ["Nan van Geloven", "Jesse Krijthe", "Saskia le Cessie"]
  description: >-
    The project focuses on how to reliably assess the performance of predictions under interventions, which is essential for determining whether such predictions can support decision-making and for comparing and selecting prediction models. It aims to develop doubly robust performance measures, particularly for time-to-event outcomes, and methods for assessing performance across internal and external data. The project also investigates the robustness of these measures to violations of causal assumptions.

- number: "3.3"
  title: "Triangulation of Performance Assessment Methods for Conditional Causal Quantities"
  phd: "TBD"
  # supervisors: ["Nan van Geloven", "Jeremy Labrecque", "Stéphanie van der Pas", "Sebastian Gabel", "Saskia le Cessie"]
  supervisors: [ "Stéphanie van der Pas", "Jeremy Labrecque", "Nan van Geloven"]
  description: >-
    Evaluating a conditional causal model itself relies on causal assumptions about the evaluation data.
    This project investigates whether combining evaluations made under different assumptions, datasets
    and approaches, including comparisons with trial results, gives a more complete and safer view of a
    model's performance. It builds on the triangulation work in Work Package 2.
