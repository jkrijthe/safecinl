# PhD projects, one block each, shown in this order as "Project <number>: <title>".
# Names must match a `name` in data/people.yaml to show that person's photo and link;
# other names are shown with initials.
# Fields: number, title (required), phd, supervisors (list, up to 6), description (Markdown).
# Titles and descriptions follow the NWO proposal.

# Work package 1: Safeguarding against violations of causal assumptions
- number: "1.1"
  title: "Detecting and Quantifying Conditional Exchangeability Violations"
  phd: "Matej Havelka"
  supervisors: ["Jesse Krijthe", "Supervisor A"]
  description: >-
    Many causal analyses assume that there is no hidden confounding or selection bias beyond what has
    been adjusted for, which cannot be tested from a single dataset without further assumptions. Researchers instead rely
    on sensitivity analysis, to provide a way to include uncertainty of hidden confounding within their findings. This
    project studies existing sensitivity analysis methods and extends them into various different settings, while 
    trying to provide a more data-informed methods to find sufficient sensitivity parameter.

- number: "1.2"
  title: "Detecting and Mitigating Positivity Violations"
  phd: "PhD Candidate B"
  supervisors: ["Jesse Krijthe", "Supervisor B"]
  description: >-
    Positivity requires that every treatment option has a real chance of occurring for every kind of
    individual we want to draw conclusions about. This project develops methods to detect positivity
    violations in high-dimensional and time-varying treatment settings, such as intensive care medicine.
    It then identifies the subgroups and treatment policies for which the data still support trustworthy
    causal claims.

- number: "1.3"
  title: "Incorporating Assumption Uncertainty into Inference"
  phd: "PhD Candidate C"
  supervisors: ["Jesse Krijthe", "Supervisor A", "Supervisor C"]
  description: >-
    Detecting assumption violations is not enough: the remaining uncertainty about the assumptions should
    also be reflected in the causal conclusions. This project uses nonparametric Bayesian methods to
    combine statistical uncertainty, modelling uncertainty and expert knowledge into the uncertainty about
    causal estimates. It also develops sensitivity analyses for proximal inference, which relies on
    negative control variables.

# Work package 2: Safe triangulation
- number: "2.1"
  title: "Formalization of Triangulation"
  phd: "PhD Candidate D"
  supervisors: ["Supervisor B", "Supervisor C"]
  description: >-
    Causal triangulation compares estimates from methods that rely on different sets of causal
    assumptions, where agreement between them strengthens the evidence. This project formalizes what
    counts as successful triangulation, including how to account for random error and for methods that
    target slightly different causal questions. The resulting guidance also makes it possible to
    pre-register triangulation studies.

- number: "2.2"
  title: "Integration of Triangulated Estimates"
  phd: "PhD Candidate E"
  supervisors: ["Jesse Krijthe", "Supervisor D"]
  description: >-
    So far, triangulation has only compared estimates from different methods; this project investigates
    when and how their evidence can be combined. It develops ways to pool estimates from methods that rely
    on different causal assumptions, and to integrate methods that produce bounds rather than a single
    estimate, such as partial identification. It also addresses what to conclude when triangulation fails.

# Work package 3: Safe performance assessment of conditional causal models
- number: "3.1"
  title: "Performance Assessment for Conditional Average Treatment Effects"
  phd: "PhD Candidate F"
  supervisors: ["Jesse Krijthe", "Supervisor A", "Supervisor B", "Supervisor C", "Supervisor D", "Supervisor E"]
  description: >-
    Conditional average treatment effects (CATEs) describe how the effect of an intervention differs
    between subgroups, but different estimators can give very different answers and the true effects are
    never observed. This project studies how reliable current methods for evaluating CATE estimators are
    when causal assumptions are violated, and makes them more robust. It also develops evaluation metrics
    that target the decisions the estimates will be used for.

- number: "3.2"
  title: "Performance Assessment for Predictions under Interventions"
  phd: "PhD Candidate G"
  supervisors: ["Jesse Krijthe", "Supervisor C"]
  description: >-
    Sometimes the question is not the size of an effect, but the expected outcome under a specific
    intervention, such as a patient's prognosis without treatment. This project develops doubly robust
    performance measures for such predictions under interventions, including for time-to-event outcomes,
    that work for internal as well as external validation. It also studies how sensitive these measures
    are to unmeasured confounding and positivity violations.

- number: "3.3"
  title: "Triangulation of Performance Assessment Methods for Conditional Causal Quantities"
  phd: "PhD Candidate H"
  supervisors: ["Supervisor A", "Supervisor D"]
  description: >-
    Evaluating a conditional causal model itself relies on causal assumptions about the evaluation data.
    This project investigates whether combining evaluations made under different assumptions, datasets
    and approaches, including comparisons with trial results, gives a more complete and safer view of a
    model's performance. It builds on the triangulation work in Work Package 2.
